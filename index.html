      <main style="font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 24px; line-height: 1.6; color: #141a22">
        <h1>QR-Реставратор — восстановление QR-кодов по фото</h1>
        <p>
          Бесплатный онлайн-инструмент для восстановления повреждённых QR-кодов. Загрузите фотографию кода —
          даже если он выцвел, порван или плохо прочитался — и приложение по пикселям соберёт читаемый QR-код,
          который можно сохранить и использовать.
        </p>
        <h2>Как это работает</h2>
        <ol>
          <li>Загрузите снимок, сдвиньте, масштабируйте и обрежьте его под рамку.</li>
          <li>Автоматически определится размер модуля QR-кода и построится сетка.</li>
          <li>Проверьте каждый модуль построчно: подтвердите цвет или инвертируйте.</li>
          <li>Из подтверждённых пикселей соберётся готовый QR, который можно сохранить как изображение.</li>
        </ol>
        <h2>Конфиденциальность</h2>
        <p>
          Все вычисления выполняются локально в вашем браузере — фото никуда не загружается и не покидает устройство.
        </p>
        <p>Для работы приложения требуется включённый JavaScript.</p>
        <h2>Частые вопросы</h2>
        <p>
          <strong>Что такое QR-реставрация?</strong> Это ручное восстановление повреждённого QR-кода по фотографии:
          приложение разбирает изображение на отдельные модули (пиксели), определяет их цвет и собирает код заново.
        </p>
        <p>
          <strong>Какие фото подходят?</strong> Чёткие снимки, где код занимает большую часть кадра, без сильных
          искажений и бликов. Подходят форматы JPG, PNG, WebP и BMP. Фото можно загрузить, перетащить в окно
          или вставить из буфера обмена (Ctrl+V).
        </p>
        <p>
          <strong>Что делать, если код не находится?</strong> Убедитесь, что код целиком в кадре и занимает
          хотя бы треть изображения, избегайте наклона камеры и бликов, обеспечьте равномерное освещение.
        </p>
        <p>
          <strong>Можно ли восстановить код без исходного фото?</strong> Нет: реставрация дополняет повреждённые
          участки на основе геометрии кода, но не может восстановить полностью утраченные данные.
        </p>
        <p><a href="https://zoommax.space/">Перейти к приложению</a></p>
      </main>

    <div id="cookie-banner" style="display:none; position:fixed; bottom:0; left:0; right:0; z-index:9999; background:#141a22; color:#f5f5f5; padding:14px 20px; font-family:system-ui,sans-serif; font-size:14px; line-height:1.5; box-shadow:0 -4px 20px rgba(0,0,0,.25);">

          Подробнее — в <a href="/privacy/" style="color:#ff4d00; text-decoration:underline;">Политике конфиденциальности</a>.
        </div>
        <div style="display:flex; gap:10px; flex-shrink:0;">
          <button id="cookie-accept" style="background:#ff4d00; color:white; border:none; padding:10px 22px; border-radius:6px; font-weight:600; cursor:pointer; font-size:14px;">
            Принять
          </button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const banner = document.getElementById('cookie-banner');
        const acceptBtn = document.getElementById('cookie-accept');
        const key = 'qrregen_cookie_consent';

        // Показываем баннер, если согласия ещё нет
        if (!localStorage.getItem(key)) {
          banner.style.display = 'block';
        }

        acceptBtn.addEventListener('click', function () {
          localStorage.setItem(key, '1');
          banner.style.display = 'none';
        });
      })();
    </script>
